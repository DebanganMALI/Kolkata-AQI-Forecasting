name: Daily live update

on:
  schedule:
    - cron: "15 12 * * *"      # 12:15 UTC = 17:45 IST, after CPCB's 4 PM bulletin is online
  workflow_dispatch:            # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "numpy>=2.0" "pandas>=2.2" "pypdf>=5.0"

      - name: Official AQI, weather, new outlook
        run: python scripts/update_live.py

      - name: Save
        run: |
          git config user.name "Debangan Mali"
          git config user.email "debanganmali.ai@yahoo.com"
          git add data/live web/data/outlook.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Live update $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git push
          fi
