name: Daily live forecast

on:
  schedule:
    - cron: "45 10 * * *"      # 10:45 UTC = 16:15 IST, just after the CPCB 4 PM update
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: live-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: pip install "numpy>=2.0"

      - name: Read live AQI, forecast tomorrow
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/live_forecast.py

      - name: Save the new forecast
        run: |
          git config user.name "Debangan Mali"
          git config user.email "debanganmali.ai@yahoo.com"
          git add data/live web/data/live.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Live forecast $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git push
          fi
